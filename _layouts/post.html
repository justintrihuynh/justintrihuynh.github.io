<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }} | Justin Huynh</title>
<meta name="description" content="{{ page.summary | escape }}">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.summary | escape }}">
<meta property="og:image" content="https://justintrihuynh.github.io/assets/og-image.png">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#1b1f24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: a single reading column for the story, with each tool shown full-width as a live demo panel beneath its write-up. */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --sunk:#eceef0; --ink:#1b1f24; --muted:#5b636c; --line:#d9dde1;
  --blue:#23282e; --blue-ink:#ffffff; --orange:#46627e; --link:#3d5873;
  --good:#2d7d4f; --good-bg:#e0f1e7; --ok:#5f8f2a; --ok-bg:#ebf3dc;
  --warn:#a86a10; --warn-bg:#f8ecd6; --crit:#b23a2b; --crit-bg:#f9e3df;
  --s1:#c74440; --s1bg:#fbe5e4; --s2:#d9762f; --s2bg:#fcebdc; --s3:#a88b12; --s3bg:#f6f0d4; --s4:#4f9443; --s4bg:#e3f1df; --s5:#2a7549; --s5bg:#d6ece0;
  --mark:#46627e; --mark-soft:rgba(70,98,126,.12); --grid:rgba(27,31,36,.08);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d21; --sunk:#15181b; --ink:#e8eaed; --muted:#9ca3ab; --line:#2e3339;
  --blue:#2a2f35; --blue-ink:#ffffff; --orange:#9db6cf; --link:#a9c1d9;
  --good:#6cc191; --good-bg:#16301f; --ok:#a3cc6a; --ok-bg:#243016; --warn:#e3a54a; --warn-bg:#352812; --crit:#f08a7a; --crit-bg:#3a1d19;
  --s1:#f08782; --s1bg:#3b1d1c; --s2:#f2a46c; --s2bg:#3b2817; --s3:#dcc35a; --s3bg:#35301a; --s4:#8cc87c; --s4bg:#1f3220; --s5:#6fc493; --s5bg:#173022;
  --mark:#9db6cf; --mark-soft:rgba(157,182,207,.16); --grid:rgba(232,234,237,.08); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --sunk:#15181b; --ink:#e8eaed; --muted:#9ca3ab; --line:#2e3339;
  --blue:#2a2f35; --blue-ink:#ffffff; --orange:#9db6cf; --link:#a9c1d9;
  --good:#6cc191; --good-bg:#16301f; --ok:#a3cc6a; --ok-bg:#243016; --warn:#e3a54a; --warn-bg:#352812; --crit:#f08a7a; --crit-bg:#3a1d19;
  --s1:#f08782; --s1bg:#3b1d1c; --s2:#f2a46c; --s2bg:#3b2817; --s3:#dcc35a; --s3bg:#35301a; --s4:#8cc87c; --s4bg:#1f3220; --s5:#6fc493; --s5bg:#173022;
  --mark:#9db6cf; --mark-soft:rgba(157,182,207,.16); --grid:rgba(232,234,237,.08); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);margin:0}
a{color:var(--link)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prose{max-width:68ch}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.01em}
.eyebrow{font:500 .78rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--orange)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* hero */
.hero{padding-block:56px 40px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px;align-items:end}
.hero h1{font-size:clamp(3rem,8vw,5.4rem);font-weight:700;text-transform:uppercase;letter-spacing:.005em}
.hero h1 span{color:var(--orange)}
.hero .role{font:600 1.15rem/1.4 var(--body);margin-top:10px}
.hero p{margin:14px 0 0}
.hero .sep{color:var(--orange);font-weight:400;margin:0 4px}
.hero .tagline{font:600 clamp(1.35rem,2.6vw,1.75rem)/1.2 var(--display);letter-spacing:.01em;margin-top:18px;max-width:30ch;text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 .92rem var(--body);padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn:hover{border-color:var(--orange)}
.hero-side{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:start}
.headshot{width:120px;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);max-width:100%}
@media (max-width:820px){.hero-side{grid-template-columns:96px minmax(0,1fr)}.headshot{width:96px}}
@media (max-width:480px){.hero-side{grid-template-columns:minmax(0,1fr)}.headshot{width:120px}}
.facts{display:grid;gap:0;border-top:2px solid var(--ink)}
.hero-side .facts div{grid-template-columns:minmax(0,1fr);gap:2px}
.facts div{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.facts dt{font:500 .74rem/1.6 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts dd{margin:0}

/* top nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topnav-in{display:flex;align-items:center;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;min-height:58px}
.brand{font:700 1.35rem var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.lmark{display:block;flex:none;overflow:visible}
.lm-c{fill:var(--ink)}
.lm-out,.lm-in{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lm-out{stroke:var(--orange)}
.lm-in{stroke:var(--surface)}
.wm-h1{margin:6px 0 0;line-height:0}
.wordmark{display:block;width:100%;max-width:600px;height:auto;overflow:visible}
.wordmark .wm-t{fill:var(--ink);font:700 104px var(--display);letter-spacing:0}
.wm-l{fill:none;stroke:var(--orange);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.foot-mark{margin-bottom:14px}
.email-line{margin:16px 0 0;font:500 1.15rem var(--mono)}
.email-line a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--orange)}
.email-line a:hover{color:var(--link)}
.hd-demo{font:500 .72rem var(--mono);letter-spacing:.12em;color:#d9a441!important;opacity:1!important}
.hd-note{margin:-6px 0 14px;color:var(--muted)}
.wm-star{fill:#d9a441}
.tablinks{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tablinks a{font:500 .9rem var(--body);color:var(--muted);text-decoration:none;padding:17px 12px 15px;border-bottom:3px solid transparent;white-space:nowrap}
.tablinks a:hover{color:var(--ink)}
.tablinks a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--orange)}
@media (max-width:560px){.topnav-in{padding-block:8px 0}.tablinks a{padding:10px 10px 10px}}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.about-grid h2{font-size:2.4rem;text-transform:uppercase;font-weight:700;margin-bottom:14px}
.about-grid p{margin:0 0 14px}
.principles{display:grid;gap:18px;border-top:2px solid var(--ink);padding-top:14px}
.pr h3{font-size:1.35rem;font-weight:600}
.pr p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.path-block{background:var(--surface);border-block:1px solid var(--line)}
.path-block h2{font-size:2rem;text-transform:uppercase;font-weight:700}
.path{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;position:relative}
.path::before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line)}
.path li{position:relative;padding:48px 14px 0 0;display:grid;gap:2px;font-size:.88rem}
.path li::before{content:"";position:absolute;top:28px;left:0;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.path li.now::before{background:var(--orange);border-color:var(--orange)}
.path .yr{position:absolute;top:0;left:0;font:500 .78rem var(--mono);color:var(--muted)}
.path li.now .yr{color:var(--orange)}
.path strong{font-size:.95rem}
.path span:last-child{color:var(--muted)}
@media (max-width:820px){
  .about-grid{grid-template-columns:minmax(0,1fr);gap:32px}
  .path{grid-template-columns:minmax(0,1fr);gap:18px}
  .path::before{left:6px;right:auto;top:6px;bottom:6px;width:2px;height:auto}
  .path li{padding:0 0 0 30px}
  .path li::before{top:2px}
  .path .yr{position:static}
}
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:22px}
.tech div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.tech span{color:var(--muted);font-size:.88rem}

.photos-block{padding-top:8px}
.photos-block h2{font-size:2rem;text-transform:uppercase;font-weight:700}
.photos{display:flex;gap:12px;margin-top:20px}
.photos figure{margin:0;min-width:0}
.photos img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.photos figcaption{font-size:.84rem;color:var(--muted);margin-top:6px}
@media (max-width:700px){.photos{flex-direction:column}.photos figure{flex:none!important}.photos img{max-height:420px;object-fit:cover;object-position:50% 30%}}

/* about refresh */
.hd-filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:14px}
.hd-filters label{display:grid;gap:4px;font-weight:500}
.hd-filters input,.hd-filters select{font:inherit;font-size:.86rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.hd-clear{font:500 .84rem var(--body);padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.hd-clear:hover{border-color:var(--orange)}
.hd-banner{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font-size:.86rem}
.hd-banner b{color:var(--good)}
.hd-banner-r{margin-left:auto;color:var(--muted)}
.hd-quads{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.hd-q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;align-content:start;background:var(--surface)}
.hd-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4fd18b;margin-right:6px;vertical-align:1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pm-ring{stroke:#5b636c}}
:root[data-theme="dark"] .pm-ring{stroke:#5b636c}
.about-block{border-top:0}
.hero-grid{align-items:center}
.hero-side{display:flex;justify-content:flex-end}
.headshot{width:220px;max-width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:14px;border:1px solid var(--line);box-shadow:0 18px 40px -18px rgba(20,25,30,.35)}
.facts-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:40px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.facts-strip div{display:grid;gap:4px;min-width:0;align-content:start}
.facts-strip dt{font:500 .74rem/1.4 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--orange)}
.facts-strip dd{margin:0;font-size:.95rem}
.about-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.75fr)!important;gap:56px!important;align-items:start}
.about-side{position:sticky;top:96px;display:grid;gap:14px}
.about-side h2{margin-bottom:0}
.pull-curve{width:150px;height:auto;display:block}
.pull-curve path{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.pull{margin:0;font:600 clamp(1.6rem,2.6vw,2.1rem)/1.15 var(--display);color:var(--ink);text-wrap:balance;max-width:14ch}
.about-body p{margin:0 0 18px;font-size:1.04rem;line-height:1.75}
.about-body p:first-child::first-line{font-weight:600}
@media (max-width:820px){
  .hero-side{justify-content:flex-start}
  .headshot{width:160px}
  .facts-strip{grid-template-columns:minmax(0,1fr);gap:14px;margin-top:28px}
  .about-grid{grid-template-columns:minmax(0,1fr)!important;gap:20px!important}
  .about-side{position:static}
}
/* sections */
section.block{padding-block:56px}
section.block > .wrap > h2{font-size:2.4rem;text-transform:uppercase;font-weight:700}
.intro{margin-top:8px}
.project{padding-block:44px;border-top:1px solid var(--line);display:grid;gap:22px}
.project{border-top:0;padding-block:28px 0}
.proj-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.proj-head h3{font-size:2rem;font-weight:700;margin-top:6px}
.proj-head p{margin:10px 0 0}
.does{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.does li{padding-left:18px;position:relative}
.does li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:2px;background:var(--orange)}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font:500 .74rem/1 var(--mono);padding:6px 9px;border-radius:6px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

/* demo frame */
.frame{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:0 1px 2px rgba(20,30,35,.05),0 10px 30px rgba(20,30,35,.06)}
.frame-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.frame-bar .dots{display:flex;gap:6px}
.frame-bar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.demo-tag{font:500 .72rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.demo-tag b{color:var(--orange);font-weight:500}
.frame-body{padding:18px}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--blue);color:#fff;margin:-18px -18px 18px;padding:12px 18px;border-bottom:3px solid var(--orange)}
.app-top strong{font:700 1.15rem var(--display);letter-spacing:.04em;text-transform:uppercase}
.app-top small{display:block;opacity:.8;font-size:.78rem}
.app-top .nav{display:flex;gap:6px;flex-wrap:wrap}
.app-top button{font:500 .84rem var(--body);background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;cursor:pointer}
.app-top button[aria-pressed="true"],.app-top button:hover{background:#fff;color:#23282e;border-color:#fff}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.daynav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.daynav button{font:500 .84rem var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.daynav button:disabled{opacity:.4;cursor:default}
.daynav button:not(:disabled):hover{border-color:var(--orange)}
.daytitle{font:700 1.6rem var(--display)}
.tag{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--orange);color:var(--surface);padding:3px 7px;border-radius:5px;vertical-align:middle;margin-left:6px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface)}
.stat .v{font:600 1.7rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .v small{font-size:.95rem;color:var(--muted);font-weight:500}
.stat .l{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat.warn{border-color:var(--crit);background:var(--crit-bg)}
.stat .sp{margin-top:6px}
.delta{font:500 .78rem var(--mono)}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--muted)}

.sessbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:16px}
.sb{background:var(--sunk);border-radius:10px;padding:9px 12px;font-size:.88rem}
.sb strong{display:block;font-size:.9rem}

.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:9px 10px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.left{text-align:left}
tr.flagged td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tr.missing td{color:var(--muted);background:var(--sunk)}
.linkbtn{background:none;border:0;padding:0;font:600 .9rem var(--body);color:var(--link);cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
th button{all:unset;cursor:pointer}
th button:hover{color:var(--ink)}
.score{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font-weight:600;color:var(--ink)}
.s1{background:var(--s1bg);box-shadow:inset 0 0 0 1.5px var(--s1)} .s2{background:var(--s2bg);box-shadow:inset 0 0 0 1.5px var(--s2)} .s3{background:var(--s3bg);box-shadow:inset 0 0 0 1.5px var(--s3)} .s4{background:var(--s4bg);box-shadow:inset 0 0 0 1.5px var(--s4)} .s5{background:var(--s5bg);box-shadow:inset 0 0 0 1.5px var(--s5)}
.lowtxt{color:var(--crit);font-weight:600}
.flag{display:inline-block;font:500 .74rem var(--body);background:var(--crit-bg);color:var(--ink);border:1px solid var(--crit);border-radius:999px;padding:1px 8px;margin:0 4px 4px 0;white-space:nowrap}
.note{font-style:italic;color:var(--muted);font-size:.84rem}
.sess{display:inline-flex;align-items:center;gap:4px;margin:0 8px 3px 0;white-space:nowrap;font-size:.82rem}
.rpe{font:600 .74rem var(--mono);background:var(--ink);color:var(--surface);border-radius:4px;padding:1px 5px}
.sbox{width:12px;height:12px;border-radius:3px;display:inline-block}
.notes{min-width:220px}
.legend{font-size:.8rem;color:var(--muted);margin-top:12px}

/* hawkin */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.cell-v{font-weight:600}
.dl{display:block;font:500 .72rem var(--mono);margin-top:2px}
.dl.up{color:var(--good)} .dl.down{color:var(--crit)} .dl.flat{color:var(--muted)}
tr.open td{background:var(--sunk)}
.detail{padding:14px!important;background:var(--sunk)}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.mini .t{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
select{font:500 .86rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* wbb */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{font:500 .78rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.zpill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:2px 8px;border-radius:999px;white-space:nowrap}
.zpill i{width:7px;height:7px;border-radius:50%;display:block}
.z-el{background:var(--good-bg)} .z-el i{background:var(--good)}
.z-ab{background:var(--ok-bg)} .z-ab i{background:var(--ok)}
.z-bw{background:var(--warn-bg)} .z-bw i{background:var(--warn)}
.z-nw{background:var(--crit-bg)} .z-nw i{background:var(--crit)}
.zv{display:block;font-weight:600}
.chg{display:block;font:500 .7rem var(--mono)}
.chg.up{color:var(--good)} .chg.down{color:var(--crit)} .chg.flat{color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);min-width:0}
.panel h4{margin:0 0 8px;font:600 1.05rem var(--display);letter-spacing:.03em;text-transform:uppercase}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 5.2rem;gap:10px;align-items:center;font-size:.86rem}
.track{height:14px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.track span{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px dashed var(--muted);opacity:.6}
.insight{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:8px 0;font-size:.9rem}
.insight.good{border-color:var(--good)} .insight.bad{border-color:var(--crit)}
svg text{fill:var(--muted);font:11px var(--mono)}

/* experience / contact */
.exp{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr);gap:24px;padding-block:20px;border-top:1px solid var(--line)}
.exp h3{font-size:1.5rem}
.creds{display:grid;gap:12px}
.creds div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.creds div:last-child{border-bottom:0;padding-bottom:0}
.creds .muted{font:500 .82rem var(--mono)}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:20px}
.contact .c{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}
.contact .c .v{font:500 1rem var(--mono);word-break:break-all;user-select:all}
footer{padding-block:48px 56px;border-top:1px solid var(--line);background:var(--surface)}
footer h2{font-size:2rem;text-transform:uppercase;font-weight:700;margin-bottom:6px}
footer .fine{font-size:.82rem;color:var(--muted);margin-top:24px}
.tablinks button{font:500 .9rem var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:17px 12px 15px;cursor:pointer;white-space:nowrap}
.tablinks button:hover{color:var(--ink)}
@media (max-width:560px){.tablinks button{padding:10px}}
.toolpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.toolpick button{font:600 1rem var(--body);color:var(--ink);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.toolpick button span{font:500 .74rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.toolpick button:hover{border-color:var(--orange)}
.toolpick button[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--orange)}
@media (max-width:560px){.toolpick{grid-template-columns:minmax(0,1fr)}}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font:500 .78rem/1.4 var(--body);padding:6px 9px;border-radius:7px;max-width:240px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}

@media (max-width:820px){
  .hero-grid,.proj-head,.split,.exp{grid-template-columns:minmax(0,1fr)}
  .hero{padding-block:36px 28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
